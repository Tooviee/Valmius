# Keeps the Supabase Free-plan project from pausing while Valmius is parked.
#
# Supabase pauses Free projects after about a week with no API traffic. This workflow sends one
# authenticated Data API request a day (a read of the public scenario packs, allowed to the anon role
# by RLS). On the first of each month it also commits a timestamp, because GitHub disables scheduled
# workflows in repositories with no activity for 60 days.
#
# Secrets to add under Settings > Secrets and variables > Actions:
#   SUPABASE_URL              e.g. https://abcdefghijklmnop.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the sb_publishable_... key (safe for browsers; RLS enforces access)

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
    - cron: "41 14 1 * *" # monthly, 1st at 14:41 UTC: records a commit so the schedule stays enabled
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' && github.event.schedule == '41 14 1 * *'

      - name: Read one public scenario pack through the Data API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY secret is missing"; exit 1; }
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/scenarios?select=id&is_pack=eq.true&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $code"
          test "$code" = "200" || { cat /tmp/body.json; exit 1; }
          grep -q '"id"' /tmp/body.json || { echo "no pack row returned"; cat /tmp/body.json; exit 1; }

      - name: Also load the public site
        run: curl -sS -o /dev/null -w 'valmius.app HTTP %{http_code}\n' --max-time 30 https://valmius.app/ || true

      - name: Record a monthly commit so GitHub keeps the schedule enabled
        if: github.event_name == 'schedule' && github.event.schedule == '41 14 1 * *'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-last-run
          git add .github/keepalive-last-run
          git commit -m "chore: keepalive heartbeat" || exit 0
          git push
