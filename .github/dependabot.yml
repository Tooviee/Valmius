# Weekly dependency updates (SPEC.md section 14, "Dependencies"). Minor and patch bumps arrive
# as one grouped pull request; majors come one at a time.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
